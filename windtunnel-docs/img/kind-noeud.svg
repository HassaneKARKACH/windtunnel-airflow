<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-labelledby="t">
  <title id="t">kind : chaque nœud du cluster est un conteneur Docker</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 13px; }
      .title { font-size: 15px; font-weight: 600; }
      .head { font-weight: 600; }
      .muted { fill: #57606a; font-size: 13px; }
      .num { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .badge { fill: #1f2328; }
      .box { fill: #ffffff; stroke: #8c959f; }
      .node { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
      .kubeadm { fill: #fff8e1; stroke: #d9a514; }
      .systemd { fill: #f6f8fa; stroke: #afb8c1; }
      .kubelet { fill: #e6f4ea; stroke: #4caf6d; }
      .containerd { fill: #f1edfb; stroke: #9a86d6; }
      .pod { fill: #ffffff; stroke: #8c959f; }
      .link { fill: none; stroke: #57606a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="698" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="490" y="31" text-anchor="middle" class="title">Poste : Ubuntu (WSL) + Docker Engine</text>

  <rect x="30" y="50" width="270" height="120" rx="8" class="box"/>
  <text x="46" y="77" class="mono head">kubectl</text>
  <circle cx="55" cy="101" r="9" class="badge"/><text x="55" y="105" class="num">5</text>
  <text x="72" y="106" class="mono">127.0.0.1:PORT</text>
  <text x="46" y="134" class="muted">kubeconfig écrit par kind</text>

  <rect x="330" y="50" width="620" height="120" rx="8" class="box"/>
  <text x="346" y="77" class="mono head">kind (CLI)</text>
  <circle cx="355" cy="97" r="9" class="badge"/><text x="355" y="101" class="num">1</text>
  <text x="372" y="102"><tspan class="mono">docker run</tspan> : un conteneur par nœud</text>
  <circle cx="355" cy="121" r="9" class="badge"/><text x="355" y="125" class="num">2</text>
  <text x="372" y="126"><tspan class="mono">docker exec</tspan> : kubeadm init, dans le control-plane</text>
  <circle cx="355" cy="145" r="9" class="badge"/><text x="355" y="149" class="num">3</text>
  <text x="372" y="150"><tspan class="mono">docker exec</tspan> : kubeadm join, dans chaque worker</text>

  <rect x="30" y="215" width="920" height="465" rx="10" fill="#eef4fb" stroke="#5b9bd5" stroke-dasharray="6 4"/>
  <text x="490" y="239" text-anchor="middle" class="muted">réseau Docker « kind »</text>

  <path d="M400,170 V253" class="link" marker-end="url(#arrow)"/>
  <circle cx="417" cy="194" r="9" class="badge"/><text x="417" y="198" class="num">1</text>
  <circle cx="439" cy="194" r="9" class="badge"/><text x="439" y="198" class="num">2</text>
  <path d="M705,170 V253" class="link" marker-end="url(#arrow)"/>
  <circle cx="722" cy="194" r="9" class="badge"/><text x="722" y="198" class="num">1</text>
  <circle cx="744" cy="194" r="9" class="badge"/><text x="744" y="198" class="num">3</text>

  <rect x="75" y="255" width="400" height="405" rx="8" class="node"/>
  <text x="91" y="281" class="head">conteneur : nœud control-plane</text>
  <rect x="91" y="295" width="368" height="64" rx="6" class="kubeadm"/>
  <circle cx="114" cy="316" r="9" class="badge"/><text x="114" y="320" class="num">2</text>
  <text x="131" y="321"><tspan class="mono">kubeadm init</tspan>, une fois</text>
  <text x="105" y="345" class="muted">certificats, manifests des pods statiques</text>
  <rect x="91" y="371" width="368" height="273" rx="6" class="systemd"/>
  <text x="105" y="391" class="mono muted">systemd</text>
  <rect x="105" y="401" width="340" height="36" rx="6" class="kubelet"/>
  <text x="119" y="424" class="mono">kubelet</text>
  <circle cx="196" cy="419" r="9" class="badge"/><text x="196" y="423" class="num">4</text>
  <text x="213" y="424">lit les manifests</text>
  <rect x="105" y="447" width="340" height="185" rx="6" class="containerd"/>
  <text x="119" y="467" class="mono muted">containerd</text>
  <rect x="119" y="477" width="312" height="30" rx="5" class="pod"/>
  <text x="133" y="497" class="mono">pod : kube-apiserver</text>
  <rect x="119" y="513" width="312" height="30" rx="5" class="pod"/>
  <text x="133" y="533" class="mono">pod : etcd</text>
  <rect x="119" y="549" width="312" height="30" rx="5" class="pod"/>
  <text x="133" y="569" class="mono">pod : scheduler</text>
  <rect x="119" y="585" width="312" height="30" rx="5" class="pod"/>
  <text x="133" y="605" class="mono">pod : controller-manager</text>

  <rect x="505" y="255" width="400" height="405" rx="8" class="node"/>
  <text x="521" y="281" class="head">conteneur : nœud worker</text>
  <rect x="521" y="295" width="368" height="64" rx="6" class="kubeadm"/>
  <circle cx="544" cy="316" r="9" class="badge"/><text x="544" y="320" class="num">3</text>
  <text x="561" y="321"><tspan class="mono">kubeadm join</tspan>, une fois</text>
  <text x="535" y="345" class="muted">enregistre le nœud auprès de l'apiserver</text>
  <rect x="521" y="371" width="368" height="273" rx="6" class="systemd"/>
  <text x="535" y="391" class="mono muted">systemd</text>
  <rect x="535" y="401" width="340" height="36" rx="6" class="kubelet"/>
  <text x="549" y="424" class="mono">kubelet</text>
  <rect x="535" y="447" width="340" height="185" rx="6" class="containerd"/>
  <text x="549" y="467" class="mono muted">containerd</text>
  <rect x="549" y="477" width="312" height="30" rx="5" class="pod"/>
  <text x="563" y="497" class="mono">pod : application</text>
  <rect x="549" y="513" width="312" height="30" rx="5" class="pod"/>
  <text x="563" y="533" class="mono">pod : application</text>
  <rect x="549" y="549" width="312" height="30" rx="5" class="pod"/>
  <text x="563" y="569" class="mono">pod : kube-proxy</text>

  <path d="M52,170 V492 H117" class="link" marker-end="url(#arrow)"/>
  <path d="M535,419 H490 V492 H433" class="link" marker-end="url(#arrow)"/>
</svg>
