<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t">
  <title id="t">Les trois nœuds du cluster kind et les pods que chacun porte</title>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 13px; }
      .title { font-size: 15px; font-weight: 600; }
      .head { font-weight: 600; }
      .muted { fill: #57606a; font-size: 13px; }
      .card { fill: #ffffff; stroke-width: 1.5; }
      .pod { fill: #ffffff; stroke: #8c959f; }
      .label { fill: #f6f8fa; stroke: #afb8c1; }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="468" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="490" y="31" text-anchor="middle" class="title">Poste : Ubuntu (WSL) + Docker Engine</text>

  <rect x="35" y="55" width="290" height="390" rx="8" class="card" stroke="#8c959f"/>
  <path d="M35,89 V63 a8,8 0 0 1 8,-8 H317 a8,8 0 0 1 8,8 V89 z" fill="#e7ebef" stroke="#8c959f" stroke-width="1.5"/>
  <text x="180" y="77" text-anchor="middle" class="head">Control-plane Kubernetes</text>
  <text x="55" y="114" class="mono head">windtunnel-control-plane</text>
  <rect x="55" y="167" width="250" height="30" rx="5" class="pod"/>
  <text x="69" y="187" class="mono">pod : kube-apiserver</text>
  <rect x="55" y="203" width="250" height="30" rx="5" class="pod"/>
  <text x="69" y="223" class="mono">pod : etcd</text>
  <rect x="55" y="239" width="250" height="30" rx="5" class="pod"/>
  <text x="69" y="259" class="mono">pod : scheduler</text>
  <rect x="55" y="275" width="250" height="30" rx="5" class="pod"/>
  <text x="69" y="295" class="mono">pod : controller-manager</text>

  <rect x="345" y="55" width="290" height="390" rx="8" class="card" stroke="#5b9bd5"/>
  <path d="M345,89 V63 a8,8 0 0 1 8,-8 H627 a8,8 0 0 1 8,8 V89 z" fill="#dbeafe" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="490" y="77" text-anchor="middle" class="head">Services Airflow</text>
  <text x="365" y="114" class="mono head">windtunnel-worker</text>
  <rect x="365" y="125" width="250" height="26" rx="13" class="label"/>
  <text x="379" y="143" class="mono">workload=airflow-services</text>
  <rect x="365" y="167" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="187" class="mono">pod : api-server</text>
  <rect x="365" y="203" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="223" class="mono">pod : scheduler</text>
  <rect x="365" y="239" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="259" class="mono">pod : dag-processor</text>
  <rect x="365" y="275" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="295" class="mono">pod : triggerer</text>
  <rect x="365" y="311" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="331" class="mono">pod : postgresql</text>
  <rect x="365" y="347" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="367" class="mono">pod : redis</text>
  <rect x="365" y="383" width="250" height="30" rx="5" class="pod"/>
  <text x="379" y="403" class="mono">pod : statsd</text>

  <rect x="655" y="55" width="290" height="390" rx="8" class="card" stroke="#4caf6d"/>
  <path d="M655,89 V63 a8,8 0 0 1 8,-8 H937 a8,8 0 0 1 8,8 V89 z" fill="#dcf5e3" stroke="#4caf6d" stroke-width="1.5"/>
  <text x="800" y="77" text-anchor="middle" class="head">Workers Airflow</text>
  <text x="675" y="114" class="mono head">windtunnel-worker2</text>
  <rect x="675" y="125" width="250" height="26" rx="13" class="label"/>
  <text x="689" y="143" class="mono">workload=airflow-tasks</text>
  <rect x="675" y="167" width="250" height="30" rx="5" class="pod"/>
  <text x="689" y="187" class="mono">pod : worker Celery 1</text>
  <rect x="675" y="203" width="250" height="30" rx="5" class="pod"/>
  <text x="689" y="223" class="mono">pod : worker Celery 2</text>
  <text x="675" y="261" class="muted">Les tâches tournent dans ces deux pods.</text>
</svg>
